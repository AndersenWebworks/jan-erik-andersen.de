<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Jan-Erik Andersen · Testvorspann Gerwing</title>
<style>
:root {
  --bg: #ffffff;
  --ink: #303033;
  --muted: #66666a;
  --red: #d40235;
  --serif: "Newsreader", Georgia, serif;
  --sans: "Schibsted Grotesk", system-ui, sans-serif;
  --pad: clamp(18px, 4vw, 56px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
::selection { background: var(--red); color: #fff; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.track { height: 620vh; }

.top { position: fixed; z-index: 2; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 20px var(--pad); font: 500 13px/1.3 var(--sans); letter-spacing: .02em; pointer-events: none; }
.top .mark { font-weight: 600; }
.top .mark span { color: var(--red); }
.top .what { color: var(--muted); text-align: right; }

.hint { position: fixed; z-index: 2; left: 50%; bottom: 84px; transform: translateX(-50%); font: 500 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); transition: opacity .5s; pointer-events: none; white-space: nowrap; }
.hint::after { content: ""; display: block; width: 1px; height: 26px; margin: 10px auto 0; background: var(--ink); opacity: .5; }
.hint.off { opacity: 0; }

.controls { position: fixed; z-index: 3; right: var(--pad); bottom: 22px; display: flex; align-items: center; gap: 14px; }
.play { appearance: none; display: inline-flex; align-items: center; gap: 10px; font: 500 14px/1 var(--sans); color: var(--ink); background: #fff; border: 1px solid var(--ink); border-radius: 2px; padding: 11px 16px 11px 14px; cursor: pointer; }
.play:hover { color: var(--red); border-color: var(--red); }
.play .ico { width: 0; height: 0; border-left: 9px solid currentColor; border-top: 5.5px solid transparent; border-bottom: 5.5px solid transparent; }
.play.on .ico { width: 9px; height: 11px; border: 0; border-left: 3px solid currentColor; border-right: 3px solid currentColor; }

.bar { position: fixed; z-index: 2; left: var(--pad); right: var(--pad); bottom: 0; height: 1px; background: rgba(48,48,51,.15); }
.bar i { display: block; height: 100%; width: 0; background: var(--ink); }

.draft-note { position: fixed; z-index: 2; left: var(--pad); bottom: 22px; font: 500 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: #fff; padding: 7px 10px; border-radius: 2px; pointer-events: none; }

.fallback { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; padding: var(--pad); }
.fallback h1 { font: 300 clamp(34px, 6vw, 72px)/1.08 var(--serif); max-width: 14em; }
.nogl .fallback { display: flex; }
.nogl #stage, .nogl .controls, .nogl .hint { display: none; }

@media (max-width: 560px) {
  .top { font-size: 12px; padding-top: 16px; }
  .top .what { display: none; }
  .hint { bottom: 80px; }
  .draft-note { display: none; }
}
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<header class="top">
  <div class="mark">Jan-Erik Andersen<span>.</span></div>
  <div class="what">Arbeit · Gerwing</div>
</header>
<main>
  <h1 class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Ein Baustoffshop, der rechnet wie ein Fachberater.</h1>
  <div class="track"></div>
</main>
<div class="fallback"><h1>Ein Baustoffshop, der rechnet wie ein Fachberater.</h1></div>
<div class="hint" id="hint">Scrollen baut das Modell auf</div>
<div class="controls"><button class="play" id="play" type="button"><span class="ico" aria-hidden="true"></span><span class="lbl">Abspielen</span></button></div>
<div class="bar"><i id="bar"></i></div>
<div class="draft-note">Testvorspann</div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="./vorspann.js"></script>
</body>
</html>
